name: Feature Request
description: Suggest an idea or feature for DS-Connect
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What problem does this solve or what feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to be implemented?
    validations:
      required: false
